name: Strategy Tests and Historical Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-strategy:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Backtest on real Gate.io candles
        run: |
          python backtest.py \
            --days 26 \
            --pairs BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT \
            --fee-pct 0.10 \
            --slippage-bps 5 \
            --notional 25 \
            --require-pass

      - name: Upload historical backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateio-scalper-historical-backtest
          path: backtest-results/
          if-no-files-found: warn
          retention-days: 30
